name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare release APK
        if: success()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/Lumina.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lumina-debug-apk
          path: release/Lumina.apk
          retention-days: 14

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: Lumina latest
          body: Автосборка для LuntikStore
          files: release/Lumina.apk
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
